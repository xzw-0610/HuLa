name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 全局环境变量，确保 Tauri 和 Gradle 在构建时能稳定读取到路径
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" "ndk;25.2.9519653"

      - name: Verify Android SDK & NDK
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          echo "NDK_HOME is: $NDK_HOME"
          ls -la $NDK_HOME

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android

      # 缓存 Rust 依赖，显著加快后续构建速度
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Create missing config file
        run: |
          mkdir -p src-tauri/configuration
          echo "{}" > src-tauri/configuration/local.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build frontend
        run: pnpm exec vite build

      # 将安装 Tauri CLI 单独拆分，方便排查错误
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      # 初始化 Android 项目并赋予 gradlew 执行权限
      - name: Init Android project and fix permissions
        run: |
          cd src-tauri
          cargo tauri android init
          chmod +x gen/android/gradlew

      # 使用 --ci 标志防止 CLI 卡在交互提示
      - name: Build APK
        run: |
          cd src-tauri
          cargo tauri android build --ci --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hula-apk
          path: '**/*.apk'

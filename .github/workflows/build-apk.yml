name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" "ndk;25.2.9519653"

      - name: Verify Android SDK & NDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "NDK_HOME: $NDK_HOME"
          test -d "$ANDROID_HOME" && echo "SDK exists" || echo "SDK missing"
          test -d "$NDK_HOME" && echo "NDK exists" || echo "NDK missing"
          ls -la $ANDROID_HOME/ndk/

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ★ 关键修复：写入符合 HuLa 后端要求的完整 local.yaml 配置
      - name: Create local.yaml configuration
        run: |
          mkdir -p src-tauri/configuration
          cat > src-tauri/configuration/local.yaml << 'EOF'
          database:
            sqlite_file: db.sqlite
          backend:
            base_url: http://localhost:8080/api
            ws_url: ws://localhost:8080/api/ws/ws
          youdao:
            app_key: ''
            app_secret: ''
          tencent:
            api_key: ''
            secret_id: ''
            map_key: ''
          EOF

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build frontend
        run: pnpm exec vite build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Init Android project and fix permissions
        run: |
          cd src-tauri
          cargo tauri android init
          chmod 755 gen/android/gradlew

      - name: Build APK
        run: |
          cd src-tauri
          cargo tauri android build --ci --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hula-apk
          path: '**/*.apk'

name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ★ 关键修复：必须先安装 pnpm，后面的 setup-node 才能识别到它
      - name: Install pnpm
        run: npm install -g pnpm

      # 此时 pnpm 已存在，可以安全开启缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Android SDK & NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "ndk;28.2.13676358"

      - name: Verify Android SDK & NDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "NDK_HOME: $NDK_HOME"
          ls -la $ANDROID_HOME/ndk/

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Create local.yaml configuration
        run: |
          mkdir -p src-tauri/configuration
          cat > src-tauri/configuration/local.yaml << 'EOF'
          database:
            sqlite_file: db.sqlite
          backend:
            base_url: http://localhost:8080/api
            ws_url: ws://localhost:8080/api/ws/ws
          youdao:
            app_key: ''
            app_secret: ''
          tencent:
            api_key: ''
            secret_id: ''
            map_key: ''
          EOF

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build frontend
        run: pnpm exec vite build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Init Android project
        run: |
          cd src-tauri
          cargo tauri android init

      - name: Update Gradle Wrapper Version
        run: |
          cd src-tauri/gen/android/gradle/wrapper
          sed -i 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-8.14.3-bin.zip|' gradle-wrapper.properties
          cat gradle-wrapper.properties

      - name: Configure ProGuard Rules
        run: |
          cd src-tauri/gen/android/app
          echo "# Keep Tauri Bridge" >> proguard-rules.pro
          echo "-keep class com.hula.app.generated.** { *; }" >> proguard-rules.pro
          echo "-keep class * extends android.webkit.WebViewClient { *; }" >> proguard-rules.pro
          echo "-keepclasseswithmembernames class * {" >> proguard-rules.pro
          echo "    native <methods>;" >> proguard-rules.pro
          echo "}" >> proguard-rules.pro
          echo "-keepattributes *Annotation*" >> proguard-rules.pro
          echo "-keepattributes Signature" >> proguard-rules.pro
          echo "-keepattributes SourceFile,LineNumberTable" >> proguard-rules.pro

      - name: Fix gradlew permissions
        run: chmod 755 src-tauri/gen/android/gradlew

      # 这里恢复正常的构建命令，如果再次失败，请留意 Build APK 这一栏底部的报错
      - name: Build APK
        run: |
          cd src-tauri
          cargo tauri android build --ci --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hula-apk
          path: '**/*.apk'
